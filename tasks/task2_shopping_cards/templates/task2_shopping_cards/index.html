<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cards</title>
</head>
<body>
    <h1>Online Shopping Products</h1>
    
    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
        {% for product in products %}
        <div style="border: 1px solid black; padding: 15px; width: 250px;">
            <img src="{{ url_for('static', filename=product.image) }}" width="100" height="100" alt="product image">
            <h3>{{ product.name }}</h3>
            <p>Category: {{ product.category }}</p>
            <p>Original Price: {{ product.price }}</p>
            <p>Discount: {{ product.discount }}</p>
            <hr>
            <h4>Final Price: {{ product.final_price }}</h4>
        </div>
        {% endfor %}
    </div>

</body>
</html>
